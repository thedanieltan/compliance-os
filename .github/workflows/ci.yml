name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Run tests
        id: tests
        continue-on-error: true
        run: node --test --test-reporter=spec tests/*.test.js > test-output.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: test-output.txt
      - name: Enforce test result
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - run: npm run policy-ir:validate
      - run: npm run domain-pack:validate
      - run: npm run domain-pack:strict
      - run: npm run domain-material:check
      - run: npm run public-release:validate
      - run: npm run demo
