name: generate-domain-reference-material
on:
  push:
    branches: [agent/wp-3-wp-4-public-validation]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wp-3-wp-4-public-validation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generate-domain-reference-material.js
      - name: Commit generated material
        run: |
          if git diff --quiet -- domain-packs policy-ir/examples; then
            echo "Generated material is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domain-packs policy-ir/examples
          git commit -m "WP-4: generate domain reference material"
          git push origin HEAD:agent/wp-3-wp-4-public-validation
